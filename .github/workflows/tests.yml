name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel ${{ matrix.laravel }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '10', testbench: '8' }
          - { php: '8.3', laravel: '10', testbench: '8' }
          - { php: '8.2', laravel: '11', testbench: '9' }
          - { php: '8.4', laravel: '11', testbench: '9' }
          - { php: '8.2', laravel: '12', testbench: '10' }
          - { php: '8.4', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.4', laravel: '13', testbench: '11' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Laravel 10 and 11 no longer get security fixes, so Composer refuses to install them by default.
      # This job only checks that the package works on them.
      - name: Allow the older Laravel versions
        if: matrix.laravel == '10' || matrix.laravel == '11'
        run: composer config audit.block-insecure false
      - name: Install the matching Laravel
        run: |
          composer require "illuminate/http:^${{ matrix.laravel }}.0" "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-update
          composer require "orchestra/testbench:^${{ matrix.testbench }}.0" --dev --no-interaction --no-update
          composer update --no-interaction --prefer-dist --with-all-dependencies
      - run: vendor/bin/phpunit

  install:
    name: Install into a new Laravel project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Follow the install steps with the newest Laravel
        run: |
          composer create-project laravel/laravel "$RUNNER_TEMP/app" --no-interaction --quiet
          cd "$RUNNER_TEMP/app"
          composer config repositories.pino-pay path "$GITHUB_WORKSPACE"
          composer require "pinosite/laravel-pino-pay:*@dev" --no-interaction
          php artisan vendor:publish --tag=pino-pay-config --no-interaction
          test -f config/pino-pay.php
          php artisan tinker --execute 'echo get_class(PinoSite\PinoPay\Facades\PinoPay::getFacadeRoot());' | grep -F 'PinoSite\PinoPay\PinoPay'

  plugin:
    name: WooCommerce plugin syntax on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check every PHP file
        run: find wordpress -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check the block checkout script
        run: node --check wordpress/pino-pay-for-woocommerce/assets/js/blocks.js
